# pub is the published branch. It only changes when a maintainer merges a pull request from
# this repository's dev branch. Any other pull request to pub is closed with a note.
#
# This runs from pub's own copy of the file (pull_request_target), so a pull request cannot
# change it. It never checks out or runs the pull request's code.
name: Guard pub

on:
  pull_request_target:
    types: [opened, reopened, edited, synchronize]
    branches: [pub]

permissions:
  pull-requests: write

jobs:
  close:
    if: github.event.pull_request.head.repo.full_name != github.repository || github.event.pull_request.head.ref != 'dev'
    runs-on: ubuntu-latest
    steps:
      - name: Close the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          gh pr close "$PR" --repo "$REPO" --comment "Thank you! \`pub\` is the published branch and only takes changes from \`dev\`. Please open your pull request against \`dev\` instead (see CONTRIBUTING.md)."
